spring.application.name=bp-builder
server.port=8081

spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=${SM_DB_USER}
spring.datasource.password=${SM_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
# The default database is a hosted Supabase instance reached through its
# transaction pooler (port 6543), which does not keep server-side prepared
# statements, hence prepareThreshold=0. Override with SPRING_DATASOURCE_URL to
# use another PostgreSQL database.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Spring Boot's own defaults (1MB/10MB) are below the sketch upload's advertised
# 10MB file limit; raise both so a file under that limit never gets rejected
# before WorkflowController even sees it.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

